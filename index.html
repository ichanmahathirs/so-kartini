<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SO Kartini</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
<h1>📦 Stok Opname Kartini <span id="masterVersion" class="muted"></span></h1>

<section id="loginView" class="card hidden">
  <strong>Masuk</strong>
  <div class="row"><div><label>Username</label><input id="loginUser" autocomplete="username" autocapitalize="none"></div></div>
  <div class="row"><div><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div></div>
  <button id="loginBtn">Masuk</button>
  <p class="muted" id="loginError"></p>
  <p class="muted">Belum punya akun? Minta dibuatkan admin.</p>
</section>

<section id="setupView" class="card hidden">
  <div class="row">
    <span>Halo, <b id="whoami"></b></span>
    <button id="logoutBtn" class="secondary">Keluar</button>
  </div>
  <div class="row"><div><label>Rak yang dihitung</label><select id="rackSelect"></select></div></div>
  <button id="startBtn">Mulai Hitung</button>
</section>

<section id="countView" class="hidden">
  <div class="card">
    <div class="row">
      <span id="sessionInfo"></span>
      <span class="badge" id="itemCount">0 item</span>
      <button id="changeRackBtn" class="secondary">Ganti Rak</button>
    </div>
    <div class="row"><span id="syncStatus" class="muted"></span></div>
    <label>Cari produk</label>
    <input id="searchInput" placeholder="ketik nama produk..." autocomplete="off">
    <div id="searchResults"></div>
    <button id="manualBtn" class="secondary hidden">+ Catat manual (tidak ada di daftar)</button>
  </div>

  <div class="card hidden" id="entryCard">
    <strong id="entryProduct"></strong>
    <div id="variantInputs"></div>
    <div class="row"><div><label>Tanggal ED (opsional)</label><input type="date" id="entryEd"></div></div>
    <div class="total" id="entryTotal">0</div>
    <div class="row">
      <button id="entrySaveBtn">Simpan</button>
      <button id="entryCancelBtn" class="secondary">Batal</button>
    </div>
  </div>

  <div class="card">
    <strong>Hasil rak ini</strong>
    <div class="result" id="resultList"></div>
    <button id="uploadBtn">⬆️ Upload</button>
  </div>
</section>

<script src="assets/vendor/supabase.js"></script>
<script type="module" src="assets/js/employee.js"></script>
<script>if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");</script>
</body>
</html>
